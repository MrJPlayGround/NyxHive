# ═══════════════════════════════════════════════════
# {{INSTANCE_NAME}} — NyxHive Instance Configuration
# ═══════════════════════════════════════════════════
#
# Generated by: nyxhive init

{{ALLOWED_DIRECTORIES_SECTION}}

# ─── Instance Identity ─────────────────────────────
[daemon]
name = "{{INSTANCE_NAME}}"
log_level = "info"
data_dir = "./data"

# ─── Server ────────────────────────────────────────
[server]
port = {{PORT}}
api_key_env = "NYXHIVE_API_KEY"
require_auth = true

# ─── Budget (optional) ────────────────────────────
# [budget]
# monthly_limit = 100
# warning_threshold = 0.8

# ─── Providers ────────────────────────────────────
{{PROVIDERS_SECTION}}

# ─── Routing ──────────────────────────────────────
[routing]
classifier_model = "{{CLASSIFIER_MODEL}}"
classifier_provider = "{{CLASSIFIER_PROVIDER}}"
cli_escalation_tasks = ["coding", "code_review"]

# ─── Context ──────────────────────────────────────
[context]
max_history = 10
summary_threshold = 20

# ─── Agents ───────────────────────────────────────

[agents.{{ORCHESTRATOR_KEY}}]
name = "{{ORCHESTRATOR_NAME}}"
role = "lead"
provider = "{{PRIMARY_PROVIDER}}"
model = "{{PRIMARY_MODEL}}"
working_directory = "./workspace/{{ORCHESTRATOR_KEY}}"
always_cli = true
agentic_mode = "strict"
system_prompt = """
You are {{ORCHESTRATOR_NAME}}, the repo lead for the {{INSTANCE_NAME}} platform.
You own the conversation, implement code directly, and delegate specialist work only when it adds leverage.
Read PLATFORM.md for full platform documentation.
"""

# ─── Channels (all optional) ─────────────────────
{{CHANNELS_SECTION}}

# ─── Scheduler ────────────────────────────────────
[scheduler]
enabled = true
tick_interval_ms = 60000

# ─── Pairing ─────────────────────────────────────
[pairing]
enabled = true

# ─── Knowledge ───────────────────────────────────
{{VAULT_SECTION}}

# ─── Projects ────────────────────────────────────
{{PROJECTS_SECTION}}
