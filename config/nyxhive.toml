# NyxHive example instance configuration.
# Copy this file into an instance workspace as .nyxhive/config.toml and edit it
# for your local paths, agents, channels, and provider choices.

allowed_directories = ["."]

[daemon]
name = "LocalNyxHive"
log_level = "info"
data_dir = "./data"
primary_agent = "nyx"

[server]
port = 3777
api_key_env = "NYXHIVE_API_KEY"
require_auth = true
request_timeout_ms = 120000

[agents.nyx]
name = "Nyx"
role = "lead"
provider = "openai"
model = "gpt-5.5"
always_cli = true
cli_fallback = "codex"
agentic_mode = "strict"
working_directory = "./workspace/nyx"
capabilities = ["tool_use"]
system_prompt = """
You are Nyx, the engineering lead for this NyxHive instance.
Read the project before changing it, keep work scoped, and verify before reporting completion.
"""

[providers.openai]
auth_mode = "codex"
runtime = "codex_app_server"
fallback = "none"

# Optional API-key providers. Leave these as env var references; never commit
# real key values into TOML.
[providers.anthropic]
api_key_env = "ANTHROPIC_API_KEY"

[providers.openrouter]
api_key_env = "OPENROUTER_API_KEY"

[providers.ollama]
url = "http://localhost:11434"
model = "llama3.2:3b"

[routing]
classifier_model = "gpt-5.5"
classifier_provider = "openai"
cli_escalation_tasks = ["coding", "code_review", "analysis", "expert"]

[context]
max_history = 200
summary_threshold = 20
summary_max_tokens = 1500
history_budget_ratio = 0.5

[scheduler]
enabled = false
tick_interval_ms = 60000

[pairing]
enabled = false
